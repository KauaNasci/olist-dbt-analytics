version: 2

models:
  - name: fct_vendas
    description: "Tabela fato contendo todos os pedidos entregues do e-commerce."
    columns:
      - name: id_pedido
        description: "Chave primária do pedido."
        tests:
          - unique
          - not_null
      - name: id_cliente
        tests:
          - not_null
      - name: valor_total_pedido
        tests:
          - not_null

  - name: dim_clientes
    description: "Tabela dimensão com a localização dos clientes."
    columns:
      - name: id_cliente
        description: "Chave primária do cliente por pedido."
        tests:
          - unique
          - not_null
